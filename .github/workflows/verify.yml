name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :shared:testDebugUnitTest :teacher-app:lintDebug :admin-app:lintDebug :teacher-app:assembleDebug :admin-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Online-Teachers-debug-APKs
          path: |
            teacher-app/build/outputs/apk/debug/*.apk
            admin-app/build/outputs/apk/debug/*.apk
